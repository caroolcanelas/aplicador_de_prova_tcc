<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Incluir Empregado</title>
</head>
<script>
async function incluirDepartamento() {
	// Criando o objeto JSON a ser processado pelo WebService
	let empregado = {
		"id" : "1",
		"nome" : "José da Silva",
		"idade" : 27,
		"depto" : {
			"id" : "1"			
		}
   	};	  
	// Definindo o objeto que descreve a requisição
	let conf = { 
					method: 'POST',		  
		  			headers: {
		      			'Accept': 'application/json',
		      			'Content-Type': 'application/json'
		    		},             
             		mode: 'cors',
             		body: JSON.stringify(empregado),
             		cache: 'default' 
             	};

	
  	try {
  		let endereco = "http://127.0.0.1:8090/prjDeNovo/ws/Empregado/incluir";
  		// Enviando a requisição para o WebService
  		let resultado = await fetch(endereco, conf);
  		// Mostrando a resposta recebida
  		console.log("resultado = " + resultado);
    	let objetoJson = await resultado.json();
    	console.log("Empregado = ", JSON.stringify(objetoJson));
  	}
  	catch(e) {
    	console.log("Erro na requisição: " + e);
  	}
}

// Solicitando a execução da função acima
incluirDepartamento();
</script>
<body>
</body>
</html>
