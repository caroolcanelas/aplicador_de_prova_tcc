<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Alterar</title>
</head>
<script>
async function alterarDepartamento() {
	// Definindo o objeto que descreve a requisição
	let conf = { 
					method: 'PUT',		  
		  			headers: {
		      			'Accept': 'application/json'
		    		},             
             		mode: 'cors',
             		cache: 'default' 
             	};

	
  	try {
  		let endereco = "http://127.0.0.1:8080/prjStateless/ws/ctrlDepartamento/alterarDepartamento/3/IT/Tecnologia_da_Informação_e_Comunicação";
  		// Enviando a requisição para o WebService
  		let resultado = await fetch(endereco, conf);
  		// Mostrando a resposta recebida
  		console.log("resultado = " + resultado);
    	let objetoJson = await resultado.json();
    	console.log("Departamento = ", JSON.stringify(objetoJson));
  	}
  	catch(e) {
    	console.log("Erro na requisição: " + e);
  	}
}

// Solicitando a execução da função acima
alterarDepartamento();
</script>
<body>
</body>
</html>
